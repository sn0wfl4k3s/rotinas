name: postar-no-RdS

on:
  schedule:
    # 4x ao dia (UTC). 02,08,14,20 UTC = 23,05,11,17 BRT.
    # R43 roda em 00,06,12,18 UTC; horários não colidem.
    - cron: "0 2,8,14,20 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: postar-no-RdS
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MPT_HOME: ${{ github.workspace }}/MoneyPrinterTurbo
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
      LLM_MODEL: ${{ vars.LLM_MODEL }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: harry0703/MoneyPrinterTurbo
          ref: 8b0206be2c7977e3bc3cf25ff99a2adc3c9c65f9
          path: MoneyPrinterTurbo

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - run: bun install --frozen-lockfile
        working-directory: postar-no-RdS

      - name: Credenciais do YouTube
        env:
          # Segredo dedicado (projeto GCP próprio) tem prioridade.
          # Fallback compartilhado mantém compatibilidade até a migração.
          YOUTUBE_CLIENT_SECRET_RDS: ${{ secrets.YOUTUBE_CLIENT_SECRET_RDS }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN_RDS }}
        run: |
          mkdir -p postar-no-RdS/credentials
          if [ -n "$YOUTUBE_CLIENT_SECRET_RDS" ]; then
            printf '%s' "$YOUTUBE_CLIENT_SECRET_RDS" > postar-no-RdS/credentials/client_secret.json
            echo "OAuth client dedicado da RdS em uso."
          else
            printf '%s' "$YOUTUBE_CLIENT_SECRET" > postar-no-RdS/credentials/client_secret.json
            echo "AVISO: usando OAuth client compartilhado; quota de 8 uploads/dia pode estourar."
          fi
          printf '%s' "$YOUTUBE_TOKEN" > postar-no-RdS/credentials/token.json

      - name: Restaurar histórico de temas
        uses: actions/cache@v4
        with:
          path: postar-no-RdS/state/
          key: youtube-state-rds-${{ github.run_id }}
          restore-keys: |
            youtube-state-rds-

      - name: Configurar MoneyPrinterTurbo
        run: bun postar-no-RdS/scripts/mpt_config.js

      - name: Subir MoneyPrinterTurbo
        working-directory: MoneyPrinterTurbo
        run: docker compose up -d --build

      - name: Esperar API
        run: |
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8080/docs >/dev/null && exit 0
            sleep 5
          done
          echo "API não subiu em 5 minutos"
          exit 1

      - name: Escolher tema
        run: |
          bun postar-no-RdS/scripts/escolher_tema.js > tema.txt
          echo "TEMA=$(cat tema.txt)" >> "$GITHUB_ENV"
          cat tema.txt

      - name: Gerar Short
        run: |
          for tentativa in 1 2 3; do
            echo "[mpt] tentativa $tentativa/3"
            if bun postar-no-RdS/scripts/mpt_generate.js \
              --subject "$TEMA" --voice pt-BR-AntonioNeural --clip-duration 3 \
              --mpt-home "$MPT_HOME" --timeout 2400 > gen.json; then
              break
            fi
            if [ "$tentativa" -eq 3 ]; then exit 1; fi
            sleep 15
          done
          echo "MP4=$(bun -p 'JSON.parse(require("fs").readFileSync("gen.json","utf-8")).files[0]')" >> "$GITHUB_ENV"

      - name: Gerar metadados
        run: bun postar-no-RdS/scripts/gen_metadata.js --subject "$TEMA" > meta.json

      - name: Publicar no YouTube
        run: bun postar-no-RdS/scripts/yt_upload.js --file "$MP4" --meta-json meta.json --privacy public --category 27 > up.json && cat up.json

      - name: Persistir token renovado
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
          SECRET_NAME: YOUTUBE_TOKEN_RDS
          TOKEN_FILE: postar-no-RdS/credentials/token.json
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "GH_ADMIN_TOKEN ausente; token renovado no runner nao persistido."
            exit 0
          fi
          gh secret set "$SECRET_NAME" --repo "${{ github.repository }}" < "$TOKEN_FILE"
          echo "Token persistido em $SECRET_NAME"

      - name: Registrar tema publicado
        run: bun postar-no-RdS/scripts/escolher_tema.js --registrar "$TEMA"

      - name: Diagnóstico do MoneyPrinterTurbo
        if: failure()
        working-directory: MoneyPrinterTurbo
        run: docker compose logs --tail=300 api

      - name: Apagar vídeo local
        if: always()
        run: '[ -n "$MP4" ] && rm -f "$MP4" || true'

      - name: Desligar MoneyPrinterTurbo
        if: always()
        working-directory: MoneyPrinterTurbo
        run: docker compose down

      - name: Avisar falha
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITULO="Falha na rotina postar-no-RdS"
          EXISTENTE=$(gh issue list --repo "${{ github.repository }}" --state open \
            --search "\"$TITULO\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTENTE" ]; then
            gh issue comment "$EXISTENTE" --repo "${{ github.repository }}" --body "Nova falha: $RUN_URL"
          else
            gh issue create --repo "${{ github.repository }}" --title "$TITULO" \
              --body "A rotina falhou. Log: $RUN_URL"
          fi
