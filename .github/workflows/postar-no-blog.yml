name: postar-no-blog

on:
  schedule:
    # 1x ao dia (UTC). BRT = UTC-3.
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: postar-no-blog
  cancel-in-progress: false

jobs:
  postar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - run: bun install --frozen-lockfile
        working-directory: postar-no-blog

      # Estado de dedupe entre execucoes. restore-keys pega o cache mais recente.
      - name: Restaurar estado
        uses: actions/cache@v4
        with:
          path: state/
          key: state-${{ github.run_id }}
          restore-keys: |
            state-

      - name: Gerar e enviar matéria
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          BLOG_EMAIL: ${{ secrets.BLOG_EMAIL }}
        run: bun postar-no-blog/scripts/post_news.js --email "$BLOG_EMAIL"

      # Uma issue aberta por problema, nao seis por dia: falha nova vira comentario.
      - name: Avisar falha
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITULO="Falha na rotina postar-no-blog"
          EXISTENTE=$(gh issue list --repo "${{ github.repository }}" --state open \
            --search "\"$TITULO\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTENTE" ]; then
            gh issue comment "$EXISTENTE" --repo "${{ github.repository }}" --body "Nova falha: $RUN_URL"
          else
            gh issue create --repo "${{ github.repository }}" --title "$TITULO" \
              --body "A rotina falhou. Log: $RUN_URL"
          fi
